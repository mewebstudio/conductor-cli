name: ci
on:
  push:
    branches: ["**"]   # tags are handled by the release workflow
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: smoke test (isolated install, no prompts)
        shell: bash
        env:
          CONDUCTOR_HOME: ${{ runner.temp }}/conductor-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: |
          go build -o conductor-bin ./cmd/conductor
          ./conductor-bin install --yes
          ./conductor-bin models
          ./conductor-bin review
          ./conductor-bin config set parallel.max_workers 3 --local
          ./conductor-bin apply
          test -f "$CLAUDE_CONFIG_DIR/skills/conductor/SKILL.md"
          test -f "$CLAUDE_CONFIG_DIR/agents/worker-standard.md"
          mkdir -p "$RUNNER_TEMP/my-skill" && printf -- '---\nname: ci-skill\ndescription: test\n---\nbody\n' > "$RUNNER_TEMP/my-skill/SKILL.md"
          ./conductor-bin skills agents set claude-code
          ./conductor-bin skills add "$RUNNER_TEMP/my-skill"
          test -f "$CLAUDE_CONFIG_DIR/skills/ci-skill/SKILL.md"
          ./conductor-bin skills remove ci-skill
          test ! -e "$CLAUDE_CONFIG_DIR/skills/ci-skill"
          ./conductor-bin uninstall
