version: 2
project_name: conductor-cli
builds:
  - main: ./cmd/conductor
    binary: conductor
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  use: github
release:
  # Reuse a release created by hand on GitHub: keep its notes, add the files.
  mode: keep-existing
  # Re-running the workflow for an existing tag replaces its files.
  replace_existing_artifacts: true
homebrew_casks:
  - name: conductor-cli
    binaries: [conductor]
    description: "Lead/worker orchestration for Claude Code with independent reviews and skills for every agent"
    homepage: "https://github.com/mewebstudio/conductor-cli"
    # Skipped (cask kept in dist/) until the tap token is configured.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
    repository:
      owner: mewebstudio
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # The binary is not notarized; without this macOS Gatekeeper blocks it.
    # postflight_steps (Homebrew 7+) replaces the deprecated Ruby postflight.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/conductor"]
        end
      end
